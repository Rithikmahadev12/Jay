<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060608;
      --surface: #0e0e12;
      --surface2: #16161c;
      --border: #1e1e26;
      --accent: #4f8bff;
      --accent-glow: rgba(79, 139, 255, 0.18);
      --text: #e8e8f0;
      --muted: #6b6b80;
      --url-color: #4caf82;
      --danger: #ff5f5f;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ══════════════ HOME PAGE ══════════════ */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 0;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.6s ease both;
    }

    .home-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,139,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 12vw, 120px);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      background: linear-gradient(135deg, #ffffff 30%, #4f8bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    .logo-sub {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: -4px;
    }

    /* ── SEARCH BOX ── */
    .search-wrap {
      position: relative;
      width: min(580px, 90vw);
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 56px 18px 22px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--accent);
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.4);
    }

    .search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }

    .search-btn:hover { background: #6fa3ff; transform: translateY(-50%) scale(1.05); }
    .search-btn:active { transform: translateY(-50%) scale(0.97); }

    .search-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; }

    /* ══════════════ RESULTS PAGE ══════════════ */
    #results-page {
      display: none;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6,6,8,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffffff 30%, #4f8bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }

    .topbar .search-wrap { width: min(560px, calc(100vw - 160px)); }

    .topbar .search-input {
      padding: 12px 50px 12px 18px;
      font-size: 15px;
      border-radius: 10px;
    }

    .topbar .search-btn { width: 32px; height: 32px; border-radius: 7px; right: 9px; }

    /* ── RESULTS BODY ── */
    .results-body {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .results-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }

    .result-card {
      margin-bottom: 28px;
      animation: slideUp 0.35s ease both;
    }

    .result-card:nth-child(2) { animation-delay: 0.05s; }
    .result-card:nth-child(3) { animation-delay: 0.08s; }
    .result-card:nth-child(4) { animation-delay: 0.11s; }
    .result-card:nth-child(5) { animation-delay: 0.14s; }
    .result-card:nth-child(n+6) { animation-delay: 0.17s; }

    .result-url {
      font-size: 12px;
      color: var(--url-color);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .result-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      line-height: 1.3;
      display: block;
      margin-bottom: 6px;
      transition: color 0.15s;
    }

    .result-title:hover { color: #6fa3ff; text-decoration: underline; text-underline-offset: 3px; }

    .result-snippet {
      font-size: 14px;
      color: #9898aa;
      line-height: 1.6;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* ── PAGINATION ── */
    .pagination {
      display: flex;
      gap: 10px;
      margin-top: 40px;
      align-items: center;
    }

    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .page-btn:hover { border-color: var(--accent); background: var(--surface2); }
    .page-btn:disabled { opacity: 0.3; cursor: default; }
    .page-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── STATES ── */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .state-box svg { width: 40px; height: 40px; opacity: 0.3; margin-bottom: 8px; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .error-msg { color: var(--danger); font-size: 14px; }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  </style>
</head>
<body>

  <!-- ══ HOME ══ -->
  <div id="home">
    <div class="home-glow"></div>
    <div class="logo-wrap">
      <div class="logo">Jay's</div>
      <div class="logo-sub">Search the web</div>
    </div>
    <div class="search-wrap">
      <input id="home-input" class="search-input" type="text" placeholder="What are you looking for?" autocomplete="off" />
      <button class="search-btn" onclick="doSearch(document.getElementById('home-input').value)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      </button>
    </div>
  </div>

  <!-- ══ RESULTS PAGE ══ -->
  <div id="results-page">
    <div class="topbar">
      <div class="topbar-logo" onclick="goHome()">Jay's</div>
      <div class="search-wrap">
        <input id="top-input" class="search-input" type="text" placeholder="Search..." autocomplete="off" />
        <button class="search-btn" onclick="doSearch(document.getElementById('top-input').value)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </button>
      </div>
    </div>
    <div class="results-body">
      <div id="results-container"></div>
    </div>
  </div>

<script>
  let currentQuery = '';
  let currentPage = 1;

  // ── Key listeners ──
  document.getElementById('home-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch(e.target.value);
  });
  document.getElementById('top-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch(e.target.value);
  });

  // ── Parse URL on load ──
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    const p = parseInt(params.get('p')) || 1;
    if (q) doSearch(q, p, false);
  });

  function goHome() {
    history.pushState({}, '', '/');
    document.getElementById('results-page').style.display = 'none';
    document.getElementById('home').style.display = 'flex';
    document.getElementById('home-input').value = '';
    document.getElementById('home-input').focus();
  }

  async function doSearch(query, page = 1, pushState = true) {
    query = (query || '').trim();
    if (!query) return;

    currentQuery = query;
    currentPage = page;

    // Switch to results view
    document.getElementById('home').style.display = 'none';
    const rp = document.getElementById('results-page');
    rp.style.display = 'block';
    document.getElementById('top-input').value = query;

    if (pushState) {
      const url = `?q=${encodeURIComponent(query)}${page > 1 ? '&p=' + page : ''}`;
      history.pushState({ query, page }, '', url);
    }

    const container = document.getElementById('results-container');

    // Detect if query looks like a URL — may need to crawl first
    const looksLikeUrl = /^https?:\/\//i.test(query) || (!query.includes(' ') && /^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(query));
    if (looksLikeUrl) {
      container.innerHTML = `<div class="state-box"><div class="spinner"></div><span>Crawling <strong style="color:var(--accent)">${escHtml(query)}</strong> for the first time…<br><small style="color:var(--muted);margin-top:8px;display:block">This takes 10–20 seconds</small></span></div>`;
    } else {
      container.innerHTML = `<div class="state-box"><div class="spinner"></div><span>Searching…</span></div>`;
    }

    try {
      const res = await fetch(`/search?q=${encodeURIComponent(query)}&p=${page}`);
      const data = await res.json();

      if (data.error) {
        container.innerHTML = `<div class="state-box"><span class="error-msg">${data.error}</span></div>`;
        return;
      }

      if (!data.results || data.results.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
            <span>No results found for <strong style="color:var(--text)">"${escHtml(query)}"</strong></span>
          </div>`;
        return;
      }

      let html = `<div class="results-meta">Results for "${escHtml(query)}" — page ${page}</div>`;

      data.results.forEach((r, i) => {
        html += `
          <div class="result-card" style="animation-delay:${Math.min(i * 0.04, 0.2)}s">
            <div class="result-url">${escHtml(r.displayUrl || r.url)}</div>
            <a class="result-title" href="${escHtml(r.url)}">${escHtml(r.title)}</a>
            <div class="result-snippet">${escHtml(r.snippet)}</div>
          </div>
          ${i < data.results.length - 1 ? '<hr class="divider">' : ''}
        `;
      });

      // Pagination
      html += `<div class="pagination">`;
      if (page > 1) {
        html += `<button class="page-btn" onclick="doSearch('${escHtml(currentQuery)}', ${page - 1})">← Prev</button>`;
      }
      html += `<button class="page-btn active" disabled>Page ${page}</button>`;
      if (data.results.length >= 8) {
        html += `<button class="page-btn" onclick="doSearch('${escHtml(currentQuery)}', ${page + 1})">Next →</button>`;
      }
      html += `</div>`;

      container.innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (err) {
      container.innerHTML = `<div class="state-box"><span class="error-msg">Something went wrong. Check your connection.</span></div>`;
    }
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Browser back/forward
  window.addEventListener('popstate', () => {
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    const p = parseInt(params.get('p')) || 1;
    if (q) doSearch(q, p, false);
    else goHome();
  });
</script>
</body>
</html>
